services:
  postgres:
    image: postgres:16-alpine
    container_name: palisad_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: palisad
      POSTGRES_USER: palisad_user
      POSTGRES_PASSWORD: palisad_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palisad_user -d palisad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: palisad_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "3100:3100"

volumes:
  postgres_data:
